name: Refresh profile README

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Update refresh marker
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = f"<!-- PROFILE_REFRESH: {datetime.now(timezone.utc).date().isoformat()} -->"
          updated = re.sub(r"<!-- PROFILE_REFRESH: .*? -->", marker, text)
          if updated != text:
              readme.write_text(updated, encoding='utf-8')
          PY

      - name: Commit refresh if changed
        run: |
          if git diff --quiet README.md; then
            echo "No profile refresh changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile marker"
          git push
